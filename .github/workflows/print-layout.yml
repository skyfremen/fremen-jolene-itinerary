name: Print layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/print-layout.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply print layout
        run: |
          echo '' | base64 -d > /tmp/print_layout.py
          python3 /tmp/print_layout.py
      - name: Commit print layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beijing-2026/index.html template/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Optimize itinerary printing by day"
          git push
