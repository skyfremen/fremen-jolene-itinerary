name: Fix back buttons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-back-buttons.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix back button layout
        run: echo '' | base64 -d > /tmp/fix_back.py && python3 /tmp/fix_back.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beijing-2026/index.html template/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix back button layout on itinerary pages"
          git push
