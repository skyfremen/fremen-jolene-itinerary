name: Link shared site UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/link-site-ui.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add shared UI assets to pages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pages = [
              (Path('index.html'), './assets/site-ui.css', './assets/site-ui.js'),
              (Path('beijing-2026/index.html'), '../assets/site-ui.css', '../assets/site-ui.js'),
              (Path('template/index.html'), '../assets/site-ui.css', '../assets/site-ui.js'),
          ]

          for path, css_href, js_src in pages:
              text = path.read_text(encoding='utf-8')
              css = f'<link rel="stylesheet" href="{css_href}">'
              js = f'<script src="{js_src}"></script>'

              if css not in text:
                  text = text.replace('</head>', f'  {css}\n</head>', 1)
              if js not in text:
                  text = text.replace('</body>', f'  {js}\n</body>', 1)

              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit page links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html beijing-2026/index.html template/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Enable shared version badge and scroll-to-top UI"
          git push
