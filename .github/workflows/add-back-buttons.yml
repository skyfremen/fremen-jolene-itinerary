name: Add back buttons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-back-buttons.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add top-left back buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for path in [Path('beijing-2026/index.html'), Path('template/index.html')]:
              text = path.read_text(encoding='utf-8')

              if '.back-home{' not in text:
                  css = '''\n    .back-home{position:absolute;top:16px;left:16px;z-index:20;display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;background:rgba(10,20,20,.46);border:1px solid rgba(255,255,255,.2);color:#ecfffb;text-decoration:none;font-size:.82rem;font-weight:800;backdrop-filter:blur(10px);transition:background .18s ease,border-color .18s ease,transform .18s ease}.back-home:hover,.back-home:focus{background:rgba(15,74,68,.78);border-color:rgba(94,234,212,.55);transform:translateY(-1px)}@media(max-width:760px){.back-home{top:9px;left:9px;padding:6px 8px;font-size:.7rem}}@media print{.back-home{display:none}}\n'''
                  text = text.replace('</style>', css + '  </style>', 1)

              if 'class="back-home"' not in text:
                  text = text.replace('<body>', '<body>\n  <a class="back-home" href="../" aria-label="Back to main itinerary page">← Back</a>', 1)

              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit back buttons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beijing-2026/index.html template/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add back buttons to itinerary pages"
          git push
