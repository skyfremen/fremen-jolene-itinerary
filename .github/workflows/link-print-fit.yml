name: Link adaptive print fitting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/link-print-fit.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Link shared print-fit script
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script = '<script src="../assets/print-fit.js"></script>'
          for path in [Path('beijing-2026/index.html'), Path('template/index.html')]:
              text = path.read_text(encoding='utf-8')
              if script not in text:
                  text = text.replace('</body>', '  ' + script + '\n</body>')
                  path.write_text(text, encoding='utf-8')
          PY
      - name: Commit page links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beijing-2026/index.html template/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Enable adaptive print fitting across itineraries"
          git push
